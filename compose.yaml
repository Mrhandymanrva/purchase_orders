services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: richmond
      POSTGRES_USER: richmond
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - richmond_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U richmond"]
      interval: 5s
      retries: 10
volumes:
  richmond_pg:
